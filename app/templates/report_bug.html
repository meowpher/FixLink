{% extends "base.html" %}

{% block title %}Report Bug - FixLink{% endblock %}

{% block content %}
<div class="container-fluid py-5 d-flex justify-content-center">
    <div class="card bg-card shadow-lg" style="max-width: 600px; width: 100%; border-radius: 16px;">
        <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold mb-2 text-adaptive">Report a Bug</h2>
            <p class="text-muted small mb-4">Help us improve the platform by describing the issue you encountered.</p>

            <form method="POST" enctype="multipart/form-data" action="{{ url_for('main.report_bug') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="origin" value="{{ request.args.get('origin', '/') }}">
                
                <div class="mb-4">
                    <label for="title" class="form-label text-muted small fw-semibold">Issue Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="e.g., App crashes when clicking the submit button" required>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label text-muted small fw-semibold">Steps to Reproduce</label>
                    <textarea class="form-control" id="description" name="description" rows="5" placeholder="1. Go to...&#10;2. Click on...&#10;3. See error..." required></textarea>
                </div>

                <div class="mb-4">
                    <label for="file" class="form-label text-muted small fw-semibold">Attach Screenshot or Video (Optional)</label>
                    <input class="form-control" type="file" id="file" name="file" accept="image/*,video/mp4">
                    <div class="form-text text-muted small">PNG, JPG, GIF, MP4 up to 10MB</div>
                </div>

                <div class="d-grid gap-2 mt-5">
                    <button type="submit" class="btn btn-primary py-2 rounded-3 fw-semibold">Submit Bug Report</button>
                    <a href="{{ request.args.get('origin', '/') }}" class="btn btn-link text-muted text-decoration-none small mt-2">Cancel and return to previous page</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .bg-card { 
        background-color: var(--bg-card, #ffffff) !important; 
        border: 1px solid var(--border-color, #e5e7eb) !important;
    }
    .text-adaptive {
        color: var(--text-main, #111827) !important;
    }
    .form-control {
        background-color: var(--bg-body, #f9fafb);
        color: var(--text-main, #111827);
        border-color: var(--border-color, #d1d5db);
    }
    .form-control:focus {
        background-color: var(--bg-body, #f9fafb);
        color: var(--text-main, #111827);
        border-color: var(--mitwpu-blue, #0d6efd);
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .form-control::placeholder {
        color: var(--text-muted, #9ca3af);
    }
</style>
{% endblock %}
