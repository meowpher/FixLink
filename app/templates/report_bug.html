{% extends "base.html" %}

{% block title %}Report Bug - FixLink{% endblock %}

{% block content %}
<!-- Custom topbar (same as login page) -->
<div class="bug-topbar">
    <div class="topbar-left">
        <img src="{{ url_for('static', filename='images/logo-lm.webp') }}" alt="MIT-WPU Logo" class="topbar-logo mitwpu-logo">
        <div class="topbar-divider"></div>
        <div class="topbar-text">
            <span class="topbar-brand">Fix Link</span>
            <span class="topbar-sub">Smart Room Maintenance</span>
        </div>
    </div>
    <button class="topbar-theme-btn" id="bugThemeToggle" aria-label="Toggle theme">
        <i class="bi bi-moon-fill" id="bugThemeIcon"></i>
    </button>
</div>

<div class="container-fluid d-flex justify-content-center align-items-center px-3" style="min-height: calc(100vh - 120px);">
    <div class="card bg-card shadow-lg" style="max-width: 330px; width: 100%; border-radius: 14px;">
        <div class="card-body p-2 px-3">
            <h5 class="fw-bold mb-1 text-adaptive">Report a Bug</h5>
            <p class="text-muted mb-2" style="font-size: 0.78rem;">Help us improve the platform by describing the issue you encountered.</p>

            <form method="POST" enctype="multipart/form-data" action="{{ url_for('main.report_bug') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="origin" value="{{ request.args.get('origin', '/') }}">
                
                <div class="mb-2">
                    <label for="title" class="form-label text-muted fw-semibold mb-1" style="font-size: 0.78rem;">Issue Title</label>
                    <input type="text" class="form-control form-control-sm" id="title" name="title" placeholder="e.g., App crashes when clicking submit" required style="font-size: 0.82rem;">
                </div>

                <div class="mb-2">
                    <label for="description" class="form-label text-muted fw-semibold mb-1" style="font-size: 0.78rem;">Steps to Reproduce</label>
                    <textarea class="form-control form-control-sm" id="description" name="description" rows="2" placeholder="1. Go to...&#10;2. Click on...&#10;3. See error..." required style="font-size: 0.82rem;"></textarea>
                </div>

                <div class="mb-2">
                    <label for="file" class="form-label text-muted fw-semibold mb-1" style="font-size: 0.78rem;">Attach Screenshot or Video (Optional)</label>
                    <input class="form-control form-control-sm" type="file" id="file" name="file" accept="image/*,video/mp4" style="font-size: 0.82rem;">
                    <div class="form-text text-muted" style="font-size: 0.72rem;">PNG, JPG, GIF, MP4 up to 10MB</div>
                </div>

                <div class="d-grid gap-1 mt-2">
                    <button type="submit" class="btn btn-primary btn-sm py-1 rounded-3 fw-semibold" style="font-size: 0.82rem;">Submit Bug Report</button>
                    <a href="{{ request.args.get('origin', '/') }}" class="btn btn-link text-muted text-decoration-none" style="font-size: 0.72rem;">Cancel and return</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    html, body {
        height: 100%;
        overflow: hidden;
        margin: 0;
    }
    /* Hide default base.html navbars */
    #mobile-top-bar { display: none !important; }
    .navbar { display: none !important; }
    #mobile-bottom-nav { display: none !important; }

    /* Custom topbar — identical to login page */
    .bug-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        padding: 0 14px;
        z-index: 100;
        background: var(--bg-card, #fff);
        border-bottom: 2px solid var(--mitwpu-blue, #0d47a1);
    }
    .bug-topbar .topbar-left {
        display: flex;
        align-items: center;
    }
    .bug-topbar .topbar-logo {
        height: 34px;
        width: auto;
        object-fit: contain;
    }
    .bug-topbar .topbar-divider {
        width: 1.5px;
        height: 28px;
        background: rgba(0,0,0,0.15);
        margin: 0 12px;
    }
    body[data-theme="dark"] .bug-topbar .topbar-divider {
        background: rgba(255,255,255,0.2);
    }
    .bug-topbar .topbar-text {
        display: flex;
        flex-direction: column;
    }
    .bug-topbar .topbar-brand {
        font-size: 18px;
        font-weight: 600;
        color: #111;
        letter-spacing: -0.4px;
        line-height: 1.1;
    }
    body[data-theme="dark"] .bug-topbar .topbar-brand { color: #fff; }
    .bug-topbar .topbar-sub {
        font-size: 9px;
        color: #666;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        font-weight: 500;
    }
    body[data-theme="dark"] .bug-topbar .topbar-sub { color: rgba(255,255,255,0.45); }
    .bug-topbar .topbar-theme-btn {
        background: transparent;
        border: none;
        font-size: 18px;
        color: #555;
        cursor: pointer;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    body[data-theme="dark"] .bug-topbar .topbar-theme-btn { color: rgba(255,255,255,0.7); }
    body[data-theme="dark"] .bug-topbar { background: var(--bg-card, #1e1e1e); }

    /* Push content below topbar */
    .main-content { padding-top: 56px !important; }

    .bg-card {
        background-color: var(--bg-card, #ffffff) !important;
        border: 1px solid var(--border-color, #e5e5e5) !important;
    }
    .text-adaptive { color: var(--text-main, #111827) !important; }
    .form-control { background-color: var(--bg-body, #f9fafb); color: var(--text-main, #111827); border-color: var(--border-color, #d1d5db); }
    .form-control:focus { background-color: var(--bg-body, #f9fafb); color: var(--text-main, #111827); border-color: var(--mitwpu-blue, #0d6efd); box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25); }
    .form-control::placeholder { color: var(--text-muted, #9ca3af); }
</style>

<script>
    // Wire up the custom theme toggle button
    document.getElementById('bugThemeToggle')?.addEventListener('click', function() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const btn = document.getElementById('themeToggleBtn');
        if (btn) btn.click(); // trigger the existing theme toggle logic
        else {
            const mobileBtn = document.getElementById('mobileThemeToggleBtn');
            if (mobileBtn) mobileBtn.click();
        }
        // Update our icon
        const icon = document.getElementById('bugThemeIcon');
        if (icon) {
            if (!isDark) {
                icon.classList.remove('bi-moon-fill');
                icon.classList.add('bi-sun-fill');
            } else {
                icon.classList.remove('bi-sun-fill');
                icon.classList.add('bi-moon-fill');
            }
        }
    });
    // Sync icon on load
    if (document.body.getAttribute('data-theme') === 'dark' || localStorage.getItem('theme') === 'dark') {
        const icon = document.getElementById('bugThemeIcon');
        if (icon) { icon.classList.remove('bi-moon-fill'); icon.classList.add('bi-sun-fill'); }
    }
</script>
{% endblock %}
