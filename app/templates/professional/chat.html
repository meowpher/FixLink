{% extends "base.html" %}

{% block title %}Chat with Admin - FixLink{% endblock %}

{% block extra_css %}
<style>
    .chat-container {
        height: calc(100vh - 160px);
        background: var(--bg-card);
        border-radius: var(--border-radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border-color);
        margin-bottom: 2rem;
        display: flex;
        flex-direction: column;
    }

    /* Professional Chat Theme Customization */
    :root {
        --chat-header-bg: linear-gradient(135deg, #0b4d8c 0%, #1a73e8 100%);
    }

    .chat-header {
        padding: 1.15rem 1.5rem;
        background: var(--chat-header-bg);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
        flex-shrink: 0;
    }

    .chat-header-title {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 auto;
        text-align: center;
    }

    .chat-back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: white;
        background: rgba(255, 255, 255, 0.16);
        font-size: 1.15rem;
        text-decoration: none;
        transition: background 0.2s ease, transform 0.15s ease;
        flex-shrink: 0;
    }

    .chat-back-btn:hover {
        background: rgba(255, 255, 255, 0.28);
        color: white;
        transform: scale(1.08);
    }

    .chat-back-btn:active {
        transform: scale(0.95);
    }

    [data-theme="dark"] .chat-header {
        background: #111111;
        border-bottom: 1px solid #262626;
    }

    [data-theme="dark"] .chat-back-btn {
        background: rgba(255, 255, 255, 0.08);
        color: #f4f4f5;
    }

    [data-theme="dark"] .chat-back-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
    }

    .chat-messages {
        flex: 1 1 0%;
        min-height: 0;
        padding: 2rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        background: #f8faff;
    }

    /* Dark mode adjustments for messages bg */
    [data-theme="dark"] .chat-messages {
        background: #0a0a0a;
    }

    .message {
        max-width: 65%;
        padding: 0.85rem 1.15rem;
        border-radius: 1.25rem;
        position: relative;
        font-size: 0.95rem;
        line-height: 1.5;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        animation: messageFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes messageFadeIn {
        from { opacity: 0; transform: translateY(10px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.sent {
        align-self: flex-end;
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 0.25rem;
    }

    .message.received {
        align-self: flex-start;
        background: white;
        color: #1e293b;
        border: 1px solid var(--border-color);
        border-bottom-left-radius: 0.25rem;
    }

    [data-theme="dark"] .message.received {
        background: #181818;
        color: #f4f4f5;
        border-color: #262626;
    }

    .message-time {
        font-size: 0.725rem;
        margin-top: 0.4rem;
        opacity: 0.7;
        display: flex;
        justify-content: flex-end;
    }

    .message.received .message-time {
        justify-content: flex-start;
    }

    .chat-input-area {
        padding: 1.5rem 1.75rem;
        background: white;
        border-top: 1px solid var(--border-color);
        position: sticky;
        bottom: 0;
        z-index: 100;
        flex-shrink: 0;
    }

    [data-theme="dark"] .chat-input-area {
        background: #121212;
        border-top-color: #222222;
    }

    .input-wrapper {
        display: flex;
        gap: 12px;
        background: #f1f5f9;
        padding: 10px 14px;
        border-radius: 2rem;
        border: 1px solid transparent;
        transition: all 0.2s;
    }

    [data-theme="dark"] .input-wrapper {
        background: #181818;
        border-color: #282828;
    }

    .input-wrapper:focus-within {
        border-color: var(--mitwpu-blue);
        background: white;
        box-shadow: 0 0 0 4px rgba(11, 77, 140, 0.1);
    }

    [data-theme="dark"] .input-wrapper:focus-within {
        background: #1c1c1c;
        border-color: #3b82f6;
    }

    .input-wrapper input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 4px 0;
        outline: none;
        color: var(--text-main);
        font-size: 0.95rem;
    }

    .send-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--mitwpu-blue, #2563eb);
        color: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        flex-shrink: 0;
    }

    .send-btn:hover {
        transform: scale(1.1) rotate(-10deg);
        background: #1d4ed8;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .send-btn:active {
        transform: scale(0.95);
    }

    [data-theme="dark"] .send-btn {
        background: #2563eb !important;
        color: #ffffff !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    [data-theme="dark"] .send-btn:hover {
        background: #1d4ed8 !important;
        color: #ffffff !important;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
    }

    .admin-status-dot {
        width: 10px;
        height: 10px;
        background: #22c55e;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        flex-shrink: 0;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       MOBILE CHAT UI (max-width: 767px)
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 767px) {
        body {
            padding-top: 56px !important;
            padding-bottom: 0 !important;
            overflow: hidden !important;
            height: 100% !important;
            position: fixed !important;
            width: 100% !important;
        }
        #mobile-bottom-nav {
            display: none !important;
        }
        .main-content {
            padding: 0 !important;
            margin: 0 !important;
            padding-top: 0 !important;
            height: calc(100vh - 56px) !important;
            height: calc(100dvh - 56px) !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
        }
        .container.mt-4 {
            padding: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
            height: 100% !important;
            flex: 1 1 auto !important;
            display: flex !important;
            flex-direction: column !important;
        }
        .chat-container {
            height: 100% !important;
            max-height: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            margin-bottom: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            position: relative !important;
        }

        /* Clean Admin Support Team header: sticky and intact */
        .chat-header {
            padding: 0.85rem 1rem !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 100 !important;
            flex-shrink: 0 !important;
        }

        .chat-header-title {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            flex: 1 1 auto !important;
            text-align: center !important;
        }

        /* Messages area */
        .chat-messages {
            flex: 1 1 0% !important;
            min-height: 0 !important;
            padding: 1rem 0.85rem !important;
            gap: 0.75rem !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
            overscroll-behavior: contain !important;
        }

        .message {
            max-width: 82%;
            font-size: 0.9rem;
            padding: 0.7rem 1rem;
            border-radius: 20px;
        }

        .message.sent { border-bottom-right-radius: 5px; }
        .message.received { border-bottom-left-radius: 5px; }

        /* Input bar */
        .chat-input-area {
            padding: 0.75rem 0.85rem !important;
            position: sticky !important;
            bottom: 0 !important;
            z-index: 100 !important;
            flex-shrink: 0 !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="chat-container">
        <div class="chat-header shadow-sm">
            <a href="{{ url_for('professional.dashboard') }}" class="chat-back-btn" aria-label="Go Back" title="Back" onclick="if(window.history.length > 1){event.preventDefault(); window.history.back();}">
                <i class="bi bi-chevron-left"></i>
            </a>
            <div class="chat-header-title">
                <span class="admin-status-dot"></span>
                <h5 class="mb-0 fw-bold text-white">Admin Support Team</h5>
            </div>
            <div class="chat-header-spacer" style="width: 32px; height: 32px;" aria-hidden="true"></div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be dynamically loaded here -->
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="chat-input" placeholder="How can we help you today?" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
            <div class="text-center mt-2">
                <small class="text-muted" style="font-size: 0.75rem;">Messages are sent immediately to the administrative team.</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Pusher Integration -->
<meta name="professional-id" content="{{ professional.id }}">
<script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
<script>
    let pusher;
    let channel;
    const professionalId = parseInt(document.querySelector('meta[name="professional-id"]').content);

    document.addEventListener('DOMContentLoaded', function() {
        initPusher();
        loadChatHistory();

        // Ensure header stays intact and page doesn't scroll offscreen on mobile keyboard open
        const chatInput = document.getElementById('chat-input');
        if (chatInput) {
            chatInput.addEventListener('focus', function() {
                window.scrollTo(0, 0);
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    scrollToBottom();
                }, 80);
            });
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function() {
                window.scrollTo(0, 0);
                scrollToBottom();
            });
            window.visualViewport.addEventListener('scroll', function() {
                window.scrollTo(0, 0);
            });
        }
    });

    function initPusher() {
        const pusherKey = '{{ PUSHER_KEY }}';
        if (!pusherKey || pusherKey === 'None' || pusherKey === 'dummy-key') {
            console.warn('Pusher key missing from configuration.');
            return;
        }

        try {
            // Configure Pusher for private channels
            pusher = new Pusher(pusherKey, {
                cluster: '{{ PUSHER_CLUSTER }}',
                authEndpoint: '/pusher/auth',
                auth: {
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                    }
                }
            });

            channel = pusher.subscribe(`private-professional-${professionalId}`);
            
            channel.bind('new_chat_message', function(data) {
                console.log('Received chat message:', data);
                
                // 1. Deduplication by ID (if fetch.then already ran)
                if (document.querySelector(`[data-id="${data.id}"]`)) {
                    console.log('Duplicate message ignored (ID exists):', data.id);
                    return;
                }

                // 2. Deduplication by Pending State (if Pusher event arrives before fetch.then)
                if (data.sender_type === 'professional' && data.sender_id == professionalId) {
                    const pendingMsg = document.querySelector('.message.sent[data-is-pending="true"]');
                    if (pendingMsg && pendingMsg.querySelector('.message-content').innerText.trim() === data.message.trim()) {
                        console.log('Syncing pending message with real data');
                        pendingMsg.dataset.id = data.id;
                        pendingMsg.dataset.isPending = 'false';
                        pendingMsg.classList.remove('opacity-50');
                        return;
                    }
                }

                // Check if message is relevant (from admin to me, or from me to admin)
                const isFromAdminToMe = data.sender_type === 'admin' && data.receiver_id === professionalId;
                const isFromMeToAdmin = data.sender_type === 'professional' && data.sender_id === professionalId;
                
                if (isFromAdminToMe || isFromMeToAdmin) {
                    addMessageToChat(data);
                    scrollToBottom();
                }
            });
            
        } catch (e) {
            console.error('Pusher init failed:', e);
        }
    }

    function loadChatHistory() {
        const container = document.getElementById('chat-messages');
        container.innerHTML = '<div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>Syncing messages...</div>';

        fetch('/professional/api/chat/history')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    container.innerHTML = '';
                    const messages = (data.data && data.data.messages) || data.messages || [];
                    if (messages.length === 0) {
                        container.innerHTML = `
                            <div class="text-center py-5 mt-4">
                                <div class="mb-3 text-muted opacity-50"><i class="bi bi-chat-left-text fs-1"></i></div>
                                <h6 class="text-muted">No messages yet.</h6>
                                <p class="text-muted small">Send a message to start chatting with the admins.</p>
                            </div>
                        `;
                    } else {
                        messages.forEach(msg => addMessageToChat(msg));
                    }
                    scrollToBottom();
                    if (window.refreshGlobalChatBadges) window.refreshGlobalChatBadges();
                }
            })
            .catch(err => {
                container.innerHTML = '<div class="alert alert-danger m-3">Failed to load chat history.</div>';
            });
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        // Optimistic UI Update: Add message immediately
        const tempId = 'temp_' + Date.now();
        const optimisticMsg = {
            id: tempId,
            message: message,
            sender_type: 'professional',
            timestamp: new Date().toISOString(),
            is_pending: true
        };
        addMessageToChat(optimisticMsg);
        scrollToBottom();

        input.value = '';
        input.focus();

        fetch('/professional/api/chat/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
            },
            body: JSON.stringify({message: message})
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Replace temp message with server message if needed, or just remove pending state
                const msgEl = document.querySelector(`[data-id="${tempId}"]`);
                if (msgEl) {
                    const chatMessage = (data.data && data.data.chat_message) || data.chat_message;
                    msgEl.dataset.id = chatMessage.id;
                    msgEl.dataset.isPending = 'false';
                    msgEl.classList.remove('opacity-50');
                }
            } else {
                // Revert optimistic update on failure
                const msgEl = document.querySelector(`[data-id="${tempId}"]`);
                if (msgEl) msgEl.remove();
                alert('Failed to send message: ' + (data.error || 'Unknown error'));
            }
        })
        .catch(err => {
            const msgEl = document.querySelector(`[data-id="${tempId}"]`);
            if (msgEl) msgEl.remove();
            alert('Network error. Please try again.');
        });
    }

    function addMessageToChat(data) {
        const container = document.getElementById('chat-messages');
        
        // Remove empty state if present
        const emptyState = container.querySelector('.text-center.py-5');
        if (emptyState) emptyState.remove();

        const isMe = data.sender_type === 'professional';
        
        const div = document.createElement('div');
        div.dataset.id = data.id;
        div.dataset.isPending = data.is_pending ? 'true' : 'false';
        div.className = `message ${isMe ? 'sent' : 'received'} ${data.is_pending ? 'opacity-50' : ''}`;
        
        // Handle UTC ISO strings by ensuring they are treated as UTC
        const timestampStr = data.timestamp.endsWith('Z') ? data.timestamp : data.timestamp + 'Z';
        const timestamp = new Date(timestampStr);
        const timeStr = timestamp.toLocaleTimeString('en-IN', { 
            hour: '2-digit', 
            minute: '2-digit',
            hour12: true,
            timeZone: 'Asia/Kolkata' 
        });
        
        div.innerHTML = `
            <div class="message-content">${data.message}</div>
            <div class="message-time">${timeStr}</div>
        `;
        
        container.appendChild(div);
        scrollToBottom();
    }

    function resetChat() {
        if (!confirm('Are you sure you want to clear your chat history with admins? This cannot be undone.')) return;
        
        fetch('/professional/api/chat/reset', {
            method: 'POST',
            headers: {
                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const container = document.getElementById('chat-messages');
                container.innerHTML = `
                    <div class="text-center py-5 mt-4">
                        <div class="mb-3 text-muted opacity-50"><i class="bi bi-chat-left-text fs-1"></i></div>
                        <h6 class="text-muted">No messages yet.</h6>
                        <p class="text-muted small">Send a message to start chatting with the admins.</p>
                    </div>
                `;
                showToast('Chat history cleared.', 'info');
            } else {
                alert('Failed to reset chat: ' + data.error);
            }
        });
    }

    function scrollToBottom() {
        const container = document.getElementById('chat-messages');
        container.scrollTop = container.scrollHeight;
    }

    function showToast(message, type) {
        // Simple toast notification - type mapping to bootstrap alert classes
        const alertType = type === 'error' ? 'danger' : type;
        const toast = document.createElement('div');
        toast.className = `alert alert-${alertType} position-fixed shadow-lg`;
        toast.style.cssText = 'top: 20px; right: 20px; z-index: 10000; min-width: 300px; border-radius: 12px;';
        
        const content = document.createElement('div');
        content.className = 'd-flex justify-content-between align-items-center';
        content.innerHTML = `
            <div class="d-flex align-items-center">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span>${message}</span>
            </div>
            <button type="button" class="btn-close ms-2" style="font-size: 0.75rem;" onclick="this.parentElement.parentElement.remove()"></button>
        `;
        
        toast.appendChild(content);
        document.body.appendChild(toast);
        
        setTimeout(() => {
            if (toast.parentElement) {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }
        }, 5000);
    }
</script>
{% endblock %}
