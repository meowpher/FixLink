<script>

    const icon = document.getElementById('loginEyeIcon');
    if (inp.type === 'password') {
        inp.type = 'text';

        icon.classList.replace('bi-eye-slash', 'bi-eye');

}

    <script>
    // Theme Toggle Logic
    (function() {
        // Function to set theme
        function setTheme(isDark, animate = false) {
            const body = document.body;
            const navbar = document.querySelector('.vyas-navbar');
            
            const performThemeSwitch = () => {
                if (isDark) {
                    document.body.setAttribute('data-theme', 'dark');
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    // Update icons depending on which button exists
                    const icon = document.getElementById('themeToggleIcon');
                    if (icon) {
                        icon.classList.remove('bi-moon-fill');
                        icon.classList.add('bi-sun-fill');
                    }
                    const iconGuest = document.getElementById('themeToggleIconGuest');
                    if (iconGuest) {
                        iconGuest.classList.remove('bi-moon-fill');
                        iconGuest.classList.add('bi-sun-fill');
                    }
                    // Update Logos
                    const logos = document.querySelectorAll('.mitwpu-logo');
                    logos.forEach(logo => logo.src = "/static/images/logo-dm.webp");
                } else {
                    document.body.removeAttribute('data-theme');
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    localStorage.setItem('theme', 'light');
                    const icon = document.getElementById('themeToggleIcon');
                    if (icon) {
                        icon.classList.remove('bi-sun-fill');
                        icon.classList.add('bi-moon-fill');
                    }
                    const iconGuest = document.getElementById('themeToggleIconGuest');
                    if (iconGuest) {
                        iconGuest.classList.remove('bi-sun-fill');
                        iconGuest.classList.add('bi-moon-fill');
                    }
                    // Update Logos
                    const logos = document.querySelectorAll('.mitwpu-logo');
                    logos.forEach(logo => logo.src = "/static/images/logo-lm.webp");
                }
            };

            if (animate && window.gsap) {
                // Determine target elements (only the main visible page content fades, not the navbar)
                const contents = document.querySelector('.main-content');
                
                // Initialize GSAP Timeline for a premium breathing cross-fade
                const tl = gsap.timeline();
                
                // Phase 1: Fade out and scale down slightly
                tl.to(contents, {
                    opacity: 0,
                    scale: 0.98,
                    duration: 0.2, // Quick exit
                    ease: "power2.inOut",
                    onComplete: () => {
                        // Crucial turning point: The content is invisible.
                        // Instantly swap the theme attributes underneath.
                        performThemeSwitch();
                    }
                })
                // Phase 2: Fade back in and scale up to normal with a gentle deceleration
                .to(contents, {
                    opacity: 1,
                    scale: 1,
                    duration: 0.35, // Slightly slower entrance for a premium feel
                    ease: "power2.out",
                    clearProps: "all" // Clean up inline transforms when done
                });
            } else {
                performThemeSwitch();
            }
        }

        // Initialize theme on load
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            setTheme(true, false);
        } else {
            setTheme(false, false);
        }

        // Add event listeners to buttons
        const btn = document.getElementById('themeToggleBtn');
        if (btn) {
            btn.addEventListener('click', () => {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                setTheme(!isDark, true);
            });
        }
        
        const btnGuest = document.getElementById('themeToggleBtnGuest');
        if (btnGuest) {
            btnGuest.addEventListener('click', () => {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                setTheme(!isDark, true);
            });
        }
    })();

    // Profile Avatar — load user info and wire up photo upload
    (function () {
        if (!document.getElementById('navAvatar')) return; // not logged in

        function getInitials(name) {
            if (!name || typeof name !== 'string' || name.trim() === '') return '?';
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0][0].toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function setAvatar(name, photoUrl, email, prn) {
            const initials = getInitials(name || '?');
            [
                { ini: 'navAvatarInitials',        img: 'navAvatarImg' },
                { ini: 'navAvatarInitialsDropdown', img: 'navAvatarImgDropdown' }
            ].forEach(({ ini, img }) => {
                const iniEl = document.getElementById(ini);
                const imgEl = document.getElementById(img);
                if (!iniEl || !imgEl) return;
                if (photoUrl) {
                    imgEl.src = photoUrl;
                    imgEl.classList.remove('d-none');
                    iniEl.classList.add('d-none');
                } else {
                    iniEl.textContent = initials;
                    iniEl.classList.remove('d-none');
                    imgEl.classList.add('d-none');
                }
            });
            const nameEl = document.getElementById('profileName');
            if (document.getElementById('removePhotoBtn'))
                document.getElementById('removePhotoBtn').classList.toggle('d-none', !photoUrl);
            if (nameEl) nameEl.textContent = name;
        }

        // Fetch current user from server
        fetch('/api/me')
            .then(r => r.json())
            .then(result => {
                if (!result.success) return;
                const data = result.data;
                const emailEl = document.getElementById('profileEmail');
                const prnEl = document.getElementById('profilePRN');
                if (emailEl) emailEl.textContent = data.email;
                if (prnEl) prnEl.textContent = data.prn || '—';
                setAvatar(data.name, data.photo_url);
            })
            .catch(() => {});

        // Photo upload
        const uploadInput = document.getElementById('photoUploadInput');
        if (uploadInput) {
            uploadInput.addEventListener('change', function () {
                if (!this.files[0]) return;
                const formData = new FormData();
                formData.append('photo', this.files[0]);
                fetch('/profile/upload-photo', { method: 'POST', body: formData })
                    .then(r => r.json())
                    .then(result => {
                        if (result.success) setAvatar(document.getElementById('profileName').textContent, result.data.photo_url);
                    });
            });
        }

        // Remove photo
        const removeBtn = document.getElementById('removePhotoBtn');
        if (removeBtn) {
            removeBtn.addEventListener('click', function (e) {
                e.preventDefault();
                fetch('/profile/remove-photo', { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) setAvatar(document.getElementById('profileName').textContent, null);
                    });
            });
        }
    })();

    // Admin Notification System
    (function() {
        const dropBtn = document.getElementById('notificationsDropdown');
        if (!dropBtn) return;

        const badge = document.getElementById('notificationBadge');
        const list = document.getElementById('notificationList');
        const markAllReadBtn = document.getElementById('markAllReadBtn');

        async function fetchNotifications() {
            try {
                const res = await fetch('/api/notifications');
                const result = await res.json();
                if (result.success) {
                    updateUI(result.data.notifications, result.data.unread_count);
                }
            } catch (err) {
                console.error('Failed to fetch notifications:', err);
            }
        }

        function updateUI(notifications, unreadCount) {
            // Cache for modal access
            localStorage.setItem('cached_notifications', JSON.stringify(notifications));
            // Update badge
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
                badge.classList.remove('d-none');
            } else {
                badge.classList.add('d-none');
            }

            // Update list
            if (!notifications || notifications.length === 0) {
                list.innerHTML = `
                    <li class="dropdown-item text-center py-4 text-muted border-0">
                        <div class="mb-2"><i class="bi bi-bell-slash fs-4"></i></div>
                        <span>No notifications yet</span>
                    </li>`;
                return;
            }

            list.innerHTML = notifications.map(n => `
                <li class="notification-item ${n.is_read ? '' : 'unread'} p-0 border-bottom">
                    <a class="dropdown-item py-2 px-3" href="${n.link || '#'}" onclick="handleNotificationClick(${n.id}, event, '${n.link || '#'}')">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <span class="fw-bold text-primary" style="font-size: 0.85rem;">${n.title}</span>
                            <small class="text-muted" style="font-size: 0.7rem;">${formatTime(n.created_at)}</small>
                        </div>
                        <p class="mb-0 text-wrap text-muted" style="font-size: 0.8rem; line-height: 1.3;">${n.message}</p>
                    </a>
                </li>
            `).join('');
        }

        window.handleNotificationClick = async function(id, e, link) {
            e.preventDefault();
            try {
                // Mark as read in background
                fetch(`/api/notifications/${id}/read`, { method: 'POST' });
                
                // Show in modal instead of navigating
                const notificationItems = JSON.parse(localStorage.getItem('cached_notifications') || '[]');
                const notification = notificationItems.find(n => n.id === id);
                
                if (notification) {
                    // Special case: If it's a ticket notification and we're on admin dashboard, use viewTicket
                    const urlParams = new URLSearchParams(notification.link.split('?')[1] || '');
                    const ticketId = urlParams.get('ticket_id') || urlParams.get('id');
                    
                    if (ticketId && typeof window.viewTicket === 'function') {
                        window.viewTicket(parseInt(ticketId));
                        return;
                    }
                    
                    // General notification modal
                    document.getElementById('notificationModalTitle').textContent = notification.title;
                    document.getElementById('notificationModalBody').textContent = notification.message;
                    
                    const actionBtn = document.getElementById('notificationModalActionBtn');
                    if (notification.link && notification.link !== '#') {
                        actionBtn.classList.remove('d-none');
                        actionBtn.href = notification.link;
                    } else {
                        actionBtn.classList.add('d-none');
                    }
                    
                    const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
                    modal.show();
                } else if (link && link !== '#') {
                    // Fallback to link if notification not found in cache
                    window.location.href = link;
                }
                
                // Reload list to update unread status in the background
                fetchNotifications();
            } catch (err) {
                console.error('Error handling notification click:', err);
                if (link && link !== '#') window.location.href = link;
            }
        };

        if (markAllReadBtn) {
            markAllReadBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                try {
                    await fetch('/api/notifications/read-all', { method: 'POST' });
                    fetchNotifications();
                } catch (err) {
                    console.error('Failed to mark all as read:', err);
                }
            });
        }

        function formatTime(isoStr) {
            const date = new Date(isoStr);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            if (diffInSeconds < 60) return 'Just now';
            if (diffInSeconds < 3600) return Math.floor(diffInSeconds / 60) + 'm ago';
            if (diffInSeconds < 86400) return Math.floor(diffInSeconds / 3600) + 'h ago';
            return date.toLocaleDateString();
        }

        // Initially fetch and poll
        fetchNotifications();
        setInterval(fetchNotifications, 15000); // Poll every 15s

        // Fetch when dropdown is opened to be fresh
        dropBtn.addEventListener('show.bs.dropdown', fetchNotifications);
    })();
    </script>

    <!-- Notification Detail Modal -->
    <div class="modal fade" id="notificationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
                <div class="modal-header border-0 bg-primary text-white py-3">
                    <h5 class="modal-title d-flex align-items-center" id="notificationModalTitle">
                        <i class="bi bi-bell-fill me-2"></i>Notification
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-center">
                    <div class="notification-icon-wrapper mb-3">
                        <i class="bi bi-info-circle text-primary display-4"></i>
                    </div>
                    <p class="lead mb-0 text-dark fw-medium" id="notificationModalBody"></p>
                </div>
                <div class="modal-footer border-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal" style="border-radius: 10px; font-weight: 500;">Close</button>
                    <a href="#" id="notificationModalActionBtn" class="btn btn-primary px-4 d-none" style="border-radius: 10px; font-weight: 500; background-color: var(--mitwpu-blue);">Go to Page</a>
                </div>
            </div>
        </div>
    </div>
    <!-- ═══════════════════════════════════════════════════
         MOBILE SIDEBAR — JavaScript
    ══════════════════════════════════════════════════════ -->
    <script>
    (function () {
        // Only run on mobile
        if (window.innerWidth >= 768) return;

        const sidebar  = document.getElementById('mobileSidebar');
        const backdrop = document.getElementById('mobileBackdrop');
        const openBtn  = document.getElementById('mobileMenuBtn');
        const closeBtn = document.getElementById('mobileCloseSidebar');
        if (!sidebar || !openBtn) return;

        /* ---- Open / Close ---- */
        function openSidebar() {
            sidebar.classList.add('msb-open');
            backdrop.classList.add('msb-backdrop-open');
            document.body.classList.add('msb-body-lock');
            openBtn.setAttribute('aria-expanded', 'true');
            openBtn.classList.add('ham-open');
            // Move focus to first focusable element
            const first = sidebar.querySelector('a, button');
            if (first) first.focus();
        }

        function closeSidebar() {
            sidebar.classList.remove('msb-open');
            backdrop.classList.remove('msb-backdrop-open');
            document.body.classList.remove('msb-body-lock');
            openBtn.setAttribute('aria-expanded', 'false');
            openBtn.classList.remove('ham-open');
            openBtn.focus();
        }

        openBtn.addEventListener('click', openSidebar);
        if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
        backdrop.addEventListener('click', closeSidebar);

        /* ---- Escape key ---- */
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && sidebar.classList.contains('msb-open')) closeSidebar();
        });

        /* ---- Focus trap ---- */
        sidebar.addEventListener('keydown', function (e) {
            if (e.key !== 'Tab') return;
            const focusable = Array.from(sidebar.querySelectorAll('a, button, [tabindex]:not([tabindex="-1"])'));
            const first = focusable[0];
            const last  = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
                e.preventDefault(); last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault(); first.focus();
            }
        });

        /* ---- Manage submenu accordion ---- */
        const subToggle = sidebar.querySelector('.msb-submenu-toggle');
        const subMenu   = document.getElementById('msb-manage-sub');
        if (subToggle && subMenu) {
            subToggle.addEventListener('click', function () {
                const expanded = subToggle.getAttribute('aria-expanded') === 'true';
                subToggle.setAttribute('aria-expanded', String(!expanded));
                subMenu.setAttribute('aria-hidden', String(expanded));
                subMenu.classList.toggle('msb-sub-open', !expanded);
                subToggle.querySelector('.msb-chevron').style.transform = !expanded ? 'rotate(180deg)' : '';
            });
        }

        /* ---- Sidebar theme toggle syncs with main toggle ---- */
        const msbTheme = document.getElementById('msbThemeBtn');
        const msbIcon  = document.getElementById('msbThemeIcon');
        if (msbTheme) {
            // Sync icon on load
            function syncMsbThemeIcon() {
                const dark = document.body.getAttribute('data-theme') === 'dark';
                if (msbIcon) {
                    msbIcon.className = dark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
                }
            }
            syncMsbThemeIcon();
            msbTheme.addEventListener('click', function () {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                // Reuse main setTheme if available
                if (typeof setTheme === 'function') {
                    setTheme(!isDark, true);
                } else {
                    const mainBtn = document.getElementById('themeToggleBtn');
                    if (mainBtn) mainBtn.click();
                }
                setTimeout(syncMsbThemeIcon, 400);
            });
        }

        /* ---- Populate user info from /api/me ---- */
        const msbAvatar = document.getElementById('msbAvatar');
        const msbName   = document.getElementById('msbUserName');
        const msbEmail  = document.getElementById('msbUserEmail');
        if (msbAvatar || msbName) {
            fetch('/api/me').then(r => r.json()).then(res => {
                if (!res.success) return;
                const d = res.data;
                if (msbName)  msbName.textContent  = d.name  || '—';
                if (msbEmail) msbEmail.textContent = d.email || '—';
                if (msbAvatar) {
                    const initials = d.name ? (d.name.trim().split(/\s+/).map(p=>p[0]).join('').slice(0,2).toUpperCase()) : '?';
                    msbAvatar.textContent = initials;
                }
            }).catch(() => {});
        }

        /* ---- Sync notification dot ---- */
        const msbNotifDot = document.getElementById('msbNotifDot');
        if (msbNotifDot) {
            const mainBadge = document.getElementById('notificationBadge');
            if (mainBadge) {
                const observer = new MutationObserver(() => {
                    msbNotifDot.classList.toggle('d-none', mainBadge.classList.contains('d-none'));
                });
                observer.observe(mainBadge, { attributes: true, attributeFilter: ['class'] });
            }
        }

        /* ---- Bell button opens notification dropdown ---- */
        const msbBell = document.getElementById('msbBellBtn');
        if (msbBell) {
            msbBell.addEventListener('click', function () {
                closeSidebar();
                const mainBell = document.getElementById('notificationsDropdown');
                if (mainBell) setTimeout(() => mainBell.click(), 320);
            });
        }
    })();
    </script>
