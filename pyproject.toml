[project]
name = "fixlink"
version = "1.0.0"
description = "MIT-WPU Smart Campus Maintenance & Timetable Tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0,<3.2.0",
    "Werkzeug>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
    "pg8000>=1.30.0",
    "Flask-Caching>=2.1.0",
    "Flask-WTF>=1.2.0",
    "qrcode>=7.4.0",
    "fpdf2>=2.7.0",
    "pusher>=3.3.0",
    "cryptography>=42.0.0",
    "pywebpush>=2.0.0",
    "pandas>=2.0.0",
    "Flask-Migrate>=4.0.0",
    "pytz>=2024.1",
    "pillow>=10.2.0",
    "gunicorn>=21.2.0",
    "gevent>=23.9.0"
]

[tool.pyrefly]
search-path = ["."]
ignore-missing-imports = ["*"]
